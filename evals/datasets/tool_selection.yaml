- case_id: where_is_abc123
  description: Read-only shipment status lookup.
  user_message: Where is shipment ABC123?
  expected:
    required_tools: [get_shipment]
    forbidden_tools: [request_reroute]
  required_facts: [delayed, NLRTM]
  tags: [read]
  scripted_steps:
    - function_call:
        name: get_shipment
        args: {shipment_id: ABC123}
    - text: ABC123 is delayed in Rotterdam.

- case_id: eta_abc123
  description: Read shipment ETA from tool data.
  user_message: What is the current ETA for ABC123?
  expected:
    required_tools: [get_shipment]
    forbidden_tools: [request_reroute]
  required_facts: ["2026-09-28T14:00:00"]
  tags: [read]
  scripted_steps:
    - function_call:
        name: get_shipment
        args: {shipment_id: ABC123}
    - text: Current ETA is 2026-09-28T14:00:00Z.

