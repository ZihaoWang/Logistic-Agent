- case_id: port_rotterdam
  description: Read port congestion for Rotterdam.
  user_message: What is the congestion level at Rotterdam?
  expected:
    required_tools: [get_port_status]
    forbidden_tools: [request_reroute]
  required_facts: [high, "18"]
  tags: [read]
  scripted_steps:
    - function_call:
        name: get_port_status
        args: {port_code: NLRTM}
    - text: Rotterdam congestion is high with 18 hours delay.

