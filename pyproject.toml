[project]
name = "agent-platform-reference"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "fastmcp>=4.0.10",
    "google-adk>=2.10.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "bandit==1.7.9",
    "pre-commit",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["google.*", "google.adk.*", "google.genai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "structlog.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "evals/datasets"]
skips = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
